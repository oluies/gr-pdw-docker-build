name: Generate example PDW PNGs

# Manual one-shot job to produce real PDW plots from inside the container,
# bypassing the upstream pdw.pulse_detect segfault that hits us on
# Apple Silicon (linux/arm64). GitHub-hosted runners are native amd64
# with no Rosetta, so the runtime works.

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "Capture length in seconds"
        required: false
        default: "0.5"
      pulse_freq_hz:
        description: "Baseband pulse frequency offset, Hz"
        required: false
        default: "60000"
      pw_us:
        description: "Pulse width, microseconds"
        required: false
        default: "5"
      pri_s:
        description: "Pulse repetition interval, seconds"
        required: false
        default: "1e-3"

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build gr-pdw image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: gr-pdw:ci
          # Reuse the existing CI build cache so we don't recompile from
          # scratch when the main CI workflow has already populated it.
          cache-from: type=gha,scope=gr-pdw
          cache-to: type=gha,scope=gr-pdw,mode=max

      - name: Run gr-pdw pipeline in container
        run: |
          mkdir -p out
          docker run --rm \
            -v "$PWD/workspace:/workspace" \
            -v "$PWD/out:/out" \
            -w /workspace \
            gr-pdw:ci \
            python3 generate_pdw.py \
              --duration ${{ inputs.duration }} \
              --pulse-freq ${{ inputs.pulse_freq_hz }} \
              --pw-us ${{ inputs.pw_us }} \
              --pri ${{ inputs.pri_s }} \
              --out /out/pdw.hdf5 \
              --iq /out/iq.cf32

      - name: Visualize (strip charts + Morlet CWT)
        run: |
          docker run --rm \
            -v "$PWD/workspace:/workspace" \
            -v "$PWD/out:/out" \
            -w /workspace \
            gr-pdw:ci \
            python3 visualize_pdw.py \
              --pdw /out/pdw.hdf5 \
              --iq /out/iq.cf32 \
              --samp-rate 1e6 \
              --outdir /out

      - name: Geo + folium map
        run: |
          # duckdb python wheel + folium aren't in the image; run on the host
          python3 -m pip install --quiet h5py numpy duckdb folium matplotlib
          python3 workspace/pdw_to_duckdb.py \
            --pdw out/pdw.hdf5 \
            --db out/radar.duckdb \
            --parquet out/pdw_geo.parquet \
            --map out/track.html

      - name: Upload generated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pdw-example-output
          path: |
            out/pdw_strip.png
            out/pdw_pri.png
            out/pdw_cwt.png
            out/pdw_geo.parquet
            out/track.html
            out/pdw.hdf5
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        run: |
          echo "### gr-pdw pipeline ran successfully :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the \`pdw-example-output\` artifact from this run to get the PNGs," >> $GITHUB_STEP_SUMMARY
          echo "drop them into \`workspace/images/\`, and open a follow-up PR to replace the synthetic screenshots." >> $GITHUB_STEP_SUMMARY
