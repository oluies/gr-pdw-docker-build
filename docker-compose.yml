services:
  gr-pdw:
    build:
      context: .
      dockerfile: Dockerfile
    image: gr-pdw:latest
    container_name: gr-pdw
    hostname: gr-pdw

    # For GUI applications (GNU Radio Companion)
    environment:
      - DISPLAY=${DISPLAY:-}
      - QT_X11_NO_MITSHM=1
      - XAUTHORITY=/tmp/.docker.xauth

    volumes:
      - ./workspace:/workspace
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${HOME}/.Xauthority:/tmp/.docker.xauth:ro

    # USRP USB devices
    devices:
      - /dev/bus/usb:/dev/bus/usb

    privileged: false

    # Host networking for USRP network discovery (Linux only)
    network_mode: host

    stdin_open: true
    tty: true

    command: /bin/bash
